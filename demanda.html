<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar demanda | Tem Sinal?</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <div class="container">
      <a href="index.html" class="marca">
        <img src="img/logo.png" alt="Logo Tem Sinal?">
        <span>Tem Sinal?</span>
      </a>
      <nav class="menu">
        <a href="index.html">Buscar</a>
        <a href="sobre.html">Sobre</a>
        <a href="mapa.html">Mapa</a>
        <a href="demanda.html" class="botao">Registrar demanda</a>
        <div class="acessibilidade">
          <button id="fonteMenos" title="Diminuir letra" aria-label="Diminuir letra">A-</button>
          <button id="fonteMais" title="Aumentar letra" aria-label="Aumentar letra">A+</button>
          <button id="contraste" title="Alto contraste" aria-label="Alto contraste">Contraste</button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <a href="javascript:history.back()" class="voltar">← Voltar</a>

      <section class="destaque">
        <div>
          <h1>Registrar sua demanda</h1>
          <p class="subtitulo">Informe sua região e ajude a mapear a falta de internet.</p>

          <form id="formDemanda" class="form-demanda">
            <div class="campo-cep">
              <input id="cep" type="text" inputmode="numeric" placeholder="Digite seu CEP..." aria-label="CEP" autocomplete="postal-code">
            </div>

            <select id="tipo" aria-label="Tipo de internet que você precisa">
              <option value="">Que tipo de internet você precisa? (opcional)</option>
              <option value="rede_movel">Rede Móvel (celular)</option>
              <option value="cabo_fibra">Cabo/Fibra (internet em casa)</option>
              <option value="radio">Rádio</option>
              <option value="satelite">Satélite</option>
              <option value="qualquer">Qualquer uma que funcione</option>
            </select>

            <label class="checkbox">
              <input id="lgpd" type="checkbox">
              <span>Concordo com a <a href="sobre.html#privacidade"><strong>Política de Privacidade (LGPD)</strong></a></span>
            </label>

            <button class="botao grande" type="submit">Enviar</button>
            <p id="erro" class="erro" role="alert"></p>
          </form>

          <p id="sucesso" class="sucesso" hidden>Sua demanda foi enviada com sucesso!</p>
        </div>

        <img class="ilustracao" src="img/internet.png" alt="Ilustração de uma casa com Wi-Fi, um satélite e uma antena">
      </section>
    </div>
  </main>

  <footer class="rodape">
    Tem Sinal? · Protótipo Global Solution 2026 · Dados simulados para demonstração
  </footer>

  <script src="js/comum.js"></script>
  <script src="js/demanda.js"></script>
</body>
</html>
